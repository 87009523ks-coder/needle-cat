<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>옷짓는 고양이</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --main-color: #2196F3; --bg-color: #F5F7FA; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .header { margin: 20px 0; font-size: 24px; font-weight: 800; text-align: center; color: #1A237E; }
        
        /* 상단 대시보드 */
        .summary-card { background: linear-gradient(135deg, #2196F3, #1976D2); border-radius: 24px; padding: 25px; color: white; box-shadow: 0 8px 16px rgba(33,150,243,0.2); margin-bottom: 20px; }
        .label { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .value { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .sub-info { font-size: 13px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; display: flex; gap: 15px; }

        /* 카드 공통 스타일 */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h3 { font-size: 16px; margin: 0 0 15px 0; color: #444; }
        
        /* 입력 폼 스타일 */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; padding-left: 2px; }
        input { width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 10px; box-sizing: border-box; background: #FAFAFA; font-size: 15px; outline: none; }
        input:focus { border-color: var(--main-color); background: #FFF; }
        input[readonly] { background: #F0F4F8; color: var(--main-color); font-weight: 600; border: 1px dashed #BDC3C7; }
        
        .btn { background: var(--main-color); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 15px; font-weight: 700; margin-top: 8px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        
        /* 리스트 스타일 */
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
        .history-item:last-child { border-bottom: none; }
        .h-date { color: #555; }
        .h-amt { font-weight: 600; color: #333; }
    </style>
</head>
<body>

<div class="header">옷짓는 고양이</div>

<div class="summary-card">
    <div class="label">이달의 납품 수량</div>
    <div id="monthQty" class="value">0개</div>
    <div class="label">총 판매액</div>
    <div id="totalPrice" class="value">₩0</div>
    <div class="sub-info">
        <span>월 건수: <b id="monthCount">0</b>건</span>
        <span>누적 납품: <b id="totalQty">0</b>개</span>
    </div>
</div>

<div class="card">
    <h3>데이터 입력</h3>
    <div class="input-group">
        <label>날짜</label>
        <input type="date" id="inputDate">
    </div>
    <div class="input-group">
        <label>납품 수량 (개)</label>
        <input type="number" id="inputDelivery" placeholder="0" oninput="calculateTotal()">
    </div>
    <div class="input-group">
        <label>재료 수량 (개)</label>
        <input type="number" id="inputMaterial" placeholder="0">
    </div>
    <div class="input-group">
        <label>단가 (원)</label>
        <input type="number" id="inputPrice" value="50000" oninput="calculateTotal()">
    </div>
    <div class="input-group">
        <label>총 금액 (자동 계산)</label>
        <input type="text" id="inputTotal" value="0원" readonly>
    </div>
    <button class="btn" onclick="saveData()">데이터 저장하기</button>
</div>

<div class="card">
    <h3>최근 기록</h3>
    <div id="historyList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdnFr8vjNOFeovvFm9Umxv kEpvnuAWLY",
        authDomain: "needle-cat.firebaseapp.com",
        projectId: "needle-cat",
        storageBucket: "needle-cat.appspot.com",
        messagingSenderId: "422542027971",
        appId: "1:422542027971:web:37f2298a24b2161209c676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 자동 계산 함수
    window.calculateTotal = () => {
        const qty = document.getElementById('inputDelivery').value || 0;
        const price = document.getElementById('inputPrice').value || 0;
        const total = qty * price;
        document.getElementById('inputTotal').value = total.toLocaleString() + '원';
    };

    // 저장 함수
    window.saveData = async () => {
        const date = document.getElementById('inputDate').value;
        const delivery = Number(document.getElementById('inputDelivery').value);
        const material = Number(document.getElementById('inputMaterial').value);
        const price = Number(document.getElementById('inputPrice').value);

        if(!date) { alert('날짜를 선택해주세요.'); return; }

        try {
            await addDoc(collection(db, "sales"), {
                date: date,
                delivery: delivery,
                material: material,
                price: price,
                total: delivery * price,
                timestamp: new Date()
            });
            alert('성공적으로 저장되었습니다!');
            document.getElementById('inputDelivery').value = '';
            document.getElementById('inputMaterial').value = '';
            calculateTotal();
        } catch (e) {
            alert('오류가 발생했습니다.');
        }
    };

    // 실시간 데이터 동기화
    const q = query(collection(db, "sales"), orderBy("date", "desc"));
    onSnapshot(q, (snapshot) => {
        let totalQty = 0, totalPrice = 0, monthQty = 0, monthCount = 0;
        const historyHtml = [];
        const currentMonth = new Date().toISOString().substring(0, 7);

        snapshot.forEach((doc) => {
            const data = doc.data();
            totalQty += data.delivery;
            totalPrice += data.total;
            if(data.date.startsWith(currentMonth)) {
                monthQty += data.delivery;
                monthCount++;
            }
            historyHtml.push(`
                <div class="history-item">
                    <span class="h-date">${data.date} (${data.delivery}개)</span>
                    <span class="h-amt">₩${data.total.toLocaleString()}</span>
                </div>
            `);
        });

        document.getElementById('totalQty').innerText = totalQty + '개';
        document.getElementById('totalPrice').innerText = '₩' + totalPrice.toLocaleString();
        document.getElementById('monthQty').innerText = monthQty + '개';
        document.getElementById('monthCount').innerText = monthCount;
        document.getElementById('historyList').innerHTML = historyHtml.join('');
    });

    document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
</script>

</body>
</html>
