<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옷짓는 고양이</title>
    <style>
        :root {
            --ivory-bg: #F9F7F2; /* 부드러운 아이보리 */
            --gold-stitch: #D4AF37; /* 금색 실 */
            --ink-black: #2C2C2C;
            --card-white: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--ivory-bg);
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            color: var(--ink-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* 금색 스티치 테두리 */
        body::before {
            content: '';
            position: fixed;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px dashed var(--gold-stitch);
            stroke-dasharray: 25, 15; /* 길게 박은 재봉틀 땀 */
            pointer-events: none;
            z-index: 1000;
        }

        .header { text-align: center; margin: 40px 0 20px; }
        .month-selector { margin-bottom: 20px; z-index: 1001; }
        select { padding: 8px; border-radius: 10px; border: 1px solid var(--gold-stitch); background: white; }

        /* 요약 카드 */
        .summary-card {
            background: linear-gradient(135deg, #fdfbf0 0%, #f5efd7 100%);
            width: 85%; max-width: 400px;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .total-amount { font-size: 32px; font-weight: bold; color: var(--ink-black); margin: 10px 0; }

        /* 품목 리스트 */
        .list-container { width: 90%; max-width: 400px; }
        .item-card {
            background: var(--card-white);
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border-left: 5px solid var(--gold-stitch);
        }
        .item-info div { font-size: 14px; color: #666; }
        .item-info strong { font-size: 17px; color: var(--ink-black); }

        /* 하단 고정 버튼 */
        .footer-btns {
            position: fixed; bottom: 30px;
            display: flex; gap: 15px;
            width: 90%; max-width: 400px;
            z-index: 1001;
        }
        .btn {
            flex: 1; padding: 18px; border-radius: 35px; border: none;
            font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn-black { background: #1a1c23; color: white; }
        .btn-gold { background: var(--gold-stitch); color: white; }

        /* 모달 창 */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 20px; width: 80%; max-width: 320px;
            border: 2px solid var(--gold-stitch);
        }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; letter-spacing: 2px;">옷짓는 고양이</h2>
    </div>

    <div class="month-selector">
        <select id="viewMonth" onchange="render()">
            <option value="2026-04">2026년 4월</option>
            <option value="2026-05" selected>2026년 5월</option>
            <option value="2026-06">2026년 6월</option>
        </select>
    </div>

    <div class="summary-card">
        <div id="selectedMonthText">26년 5월</div>
        <div class="total-amount" id="totalDisplay">0원</div>
        <div style="font-size:14px; opacity: 0.7;">월간 총 판매액</div>
    </div>

    <div class="list-container" id="itemList"></div>

    <div class="footer-btns">
        <button class="btn btn-black" onclick="showModal()">🧵 수량 기록</button>
        <button class="btn btn-gold" onclick="alert('정산 기능 준비 중입니다.')">💰 정산 기록</button>
    </div>

    <div class="modal" id="recordModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">수량 기록하기</h3>
            <input type="text" id="pName" placeholder="품목명 (예: 비단 저고리)">
            <input type="number" id="pCount" placeholder="갯수">
            <input type="number" id="pPrice" placeholder="가격 (단가)">
            <button class="btn btn-black" style="width:100%; margin-top:10px;" onclick="addRecord()">기록 추가</button>
            <button class="btn" style="width:100%; margin-top:5px; background:#eee;" onclick="hideModal()">취소</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('needleCatDB')) || [];

        function showModal() { document.getElementById('recordModal').style.display = 'flex'; }
        function hideModal() { document.getElementById('recordModal').style.display = 'none'; }

        function addRecord() {
            const name = document.getElementById('pName').value;
            const count = parseInt(document.getElementById('pCount').value);
            const price = parseInt(document.getElementById('pPrice').value);
            const month = document.getElementById('viewMonth').value;

            if(name && count && price) {
                db.push({ month, name, count, price, id: Date.now() });
                saveAndRender();
                hideModal();
                document.getElementById('pName').value = '';
                document.getElementById('pCount').value = '';
                document.getElementById('pPrice').value = '';
            }
        }

        function deleteRecord(id) {
            if(confirm("기록을 삭제하시겠습니까?")) {
                db = db.filter(item => item.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('needleCatDB', JSON.stringify(db));
            render();
        }

        function render() {
            const currentMonth = document.getElementById('viewMonth').value;
            document.getElementById('selectedMonthText').innerText = currentMonth.replace('-', '년 ') + '월';
            
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            
            let total = 0;
            const filtered = db.filter(item => item.month === currentMonth);
            
            filtered.forEach(item => {
                const itemTotal = item.price * item.count;
                total += itemTotal;
                listEl.innerHTML += `
                    <div class="item-card">
                        <div class="item-info">
                            <strong>${item.name}</strong>
                            <div>${item.price.toLocaleString()}원 × ${item.count}개</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold;">${itemTotal.toLocaleString()}원</div>
                            <button onclick="deleteRecord(${item.id})" style="border:none; background:none; color:#ccc; cursor:pointer; font-size:12px;">삭제</button>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('totalDisplay').innerText = total.toLocaleString() + "원";
        }

        render();
    </script>
</body>
</html>
