<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>집 짓는 고양이</title>
    <style>
        :root { --main: #4CAF50; --bg: #F9F9F9; --dark: #2E7D32; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; font-size: 26px; font-weight: 900; color: var(--dark); margin: 20px 0; }
        
        /* 상단 요약 */
        .summary-card { background: linear-gradient(135deg, #4CAF50, #2E7D32); border-radius: 24px; padding: 25px; color: white; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(76,175,80,0.2); }
        .summary-card div { margin-bottom: 5px; opacity: 0.9; font-size: 13px; }
        .summary-card b { font-size: 28px; display: block; margin-bottom: 15px; opacity: 1; }

        /* 입력 폼 */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h3 { font-size: 16px; margin: 0 0 15px 0; color: #444; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 14px; border: 1px solid #E0E0E0; border-radius: 12px; box-sizing: border-box; font-size: 16px; background: #FAFAFA; outline: none; }
        input:focus { border-color: var(--main); background: #FFF; }
        
        .btn { background: var(--dark); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        
        /* 리스트 */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #F0F0F0; }
        .item-info b { font-size: 16px; display: block; color: #222; }
        .item-info span { font-size: 13px; color: #777; }
        .del-btn { background: #FFEBEE; color: #F44336; border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">🏠 집 짓는 고양이</div>

<div class="summary-card">
    <div>이달의 작업 수량</div>
    <b id="monthQty">0개</b>
    <div>이달의 예상 매출</div>
    <b id="monthPrice">₩0</b>
</div>

<div class="card">
    <h3>새 작업 기록</h3>
    <div class="input-group">
        <label>날짜</label>
        <input type="date" id="inputDate">
    </div>
    <div class="input-group">
        <label>작업 수량(개)</label>
        <input type="number" id="inputQty" placeholder="수량을 입력하세요">
    </div>
    <div class="input-group">
        <label>단가(원)</label>
        <input type="number" id="inputPrice" value="50000">
    </div>
    <button class="btn" onclick="saveData()">데이터 저장하기</button>
</div>

<div class="card">
    <h3>최근 기록 (5월 10일 포함)</h3>
    <div id="historyList">기록을 확인하고 있습니다...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdnFr8vjNOFeovvFm9Umxv kEpvnuAWLY",
        authDomain: "needle-cat.firebaseapp.com",
        databaseURL: "https://needle-cat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "needle-cat",
        appId: "1:422542027971:web:37f2298a24b2161209c676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'house_cat_v2'); // 꼬이지 않게 새로운 경로 사용

    // 저장 함수
    window.saveData = async () => {
        const date = document.getElementById('inputDate').value;
        const qty = Number(document.getElementById('inputQty').value);
        const price = Number(document.getElementById('inputPrice').value);

        if(!date || qty <= 0) return alert('날짜와 수량을 정확히 입력해주세요.');

        // 확인 팝업
        if(!confirm(`[저장 확인]\n날짜: ${date}\n수량: ${qty}개\n\n이 기록을 저장하시겠습니까?`)) return;

        try {
            await push(dbRef, {
                date, qty, price, total: qty * price, timestamp: Date.now()
            });
            document.getElementById('inputQty').value = '';
            alert('성공적으로 저장되었습니다.');
        } catch (e) { alert('오류가 발생했습니다.'); }
    };

    // 삭제 함수
    window.deleteItem = (id) => {
        if(confirm('이 기록을 삭제하시겠습니까?')) remove(ref(db, `house_cat_v2/${id}`));
    };

    // 실시간 데이터 로드
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('historyList');
        const currentMonth = new Date().toISOString().substring(0, 7);
        
        let mQty = 0, mPrice = 0;
        let html = '';

        if (data) {
            const sorted = Object.entries(data).sort((a, b) => b[1].date.localeCompare(a[1].date));
            sorted.forEach(([id, val]) => {
                if(val.date.startsWith(currentMonth)) {
                    mQty += (val.qty || 0);
                    mPrice += (val.total || 0);
                }
                html += `
                    <div class="history-item">
                        <div class="item-info">
                            <b>${val.date}</b>
                            <span>${val.qty}개 / ₩${(val.total || 0).toLocaleString()}</span>
                        </div>
                        <button class="del-btn" onclick="deleteItem('${id}')">삭제</button>
                    </div>`;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<p style="text-align:center; color:#999;">저장된 기록이 없습니다.</p>';
        }
        document.getElementById('monthQty').innerText = mQty + '개';
        document.getElementById('monthPrice').innerText = '₩' + mPrice.toLocaleString();
    });

    // 오늘 날짜 자동 세팅
    document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
</script>
</body>
</html>
