<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>옷 짓는 고양이</title>
    <style>
        :root { --main-color: #2196F3; --bg-color: #F5F7FA; --red-color: #F44336; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; line-height: 1.5; }
        .header { margin: 20px 0; font-size: 24px; font-weight: 800; text-align: center; color: #1A237E; }
        .summary-card { background: linear-gradient(135deg, #2196F3, #1976D2); border-radius: 24px; padding: 25px; color: white; box-shadow: 0 8px 16px rgba(33,150,243,0.2); margin-bottom: 20px; }
        .label { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .value { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .sub-info { font-size: 13px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; display: flex; gap: 15px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h3 { font-size: 16px; margin: 0 0 15px 0; color: #444; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; padding-left: 2px; }
        input { width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 10px; box-sizing: border-box; background: #FAFAFA; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--main-color); background: #fff; }
        input[readonly] { background: #F0F4F8; color: var(--main-color); font-weight: 600; border: 1px dashed #BDC3C7; }
        .btn { background: var(--main-color); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 15px; font-weight: 700; margin-top: 8px; cursor: pointer; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px; }
        .history-item:last-child { border-bottom: none; }
        .del-btn { background: none; border: 1px solid #ff000033; color: var(--red-color); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">옷 짓는 고양이</div>

<div class="summary-card">
    <div class="label">이달의 납품 수량</div>
    <div id="monthQty" class="value">0개</div>
    <div class="label">총 판매액</div>
    <div id="totalPrice" class="value">₩0</div>
    <div class="sub-info">
        <span>월 건수: <b id="monthCount">0</b>건</span>
        <span>총: <b id="totalQty">0개</b></span>
    </div>
</div>

<div class="card">
    <h3>입력</h3>
    <div class="input-group"><label>데이트</label><input type="date" id="inputDate"></div>
    <div class="input-group"><label>수량(개)</label><input type="number" id="inputDelivery" placeholder="0" oninput="calculateTotal()"></div>
    <div class="input-group"><label>재료량(개)</label><input type="number" id="inputMaterial" placeholder="0"></div>
    <div class="input-group"><label>단가 (원)</label><input type="number" id="inputPrice" value="50000" oninput="calculateTotal()"></div>
    <div class="input-group"><label>총(자동충전)</label><input type="text" id="inputTotal" value="0원" readonly></div>
    <button class="btn" onclick="saveData()">저장하기</button>
</div>

<div class="card">
    <h3>최근 기록</h3>
    <div id="historyList">
        <p style="text-align:center; color:#999; font-size:12px;">데이터를 불러오는 중입니다...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdnFr8vjNOFeovvFm9Umxv kEpvnuAWLY",
        authDomain: "needle-cat.firebaseapp.com",
        databaseURL: "https://needle-cat-default-rtdb.firebaseio.com",
        projectId: "needle-cat",
        storageBucket: "needle-cat.appspot.com",
        messagingSenderId: "422542027971",
        appId: "1:422542027971:web:37f2298a24b2161209c676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.calculateTotal = () => {
        const qty = document.getElementById('inputDelivery').value || 0;
        const price = document.getElementById('inputPrice').value || 0;
        document.getElementById('inputTotal').value = (qty * price).toLocaleString() + '원';
    };

    window.saveData = async () => {
        const date = document.getElementById('inputDate').value;
        const delivery = Number(document.getElementById('inputDelivery').value);
        const material = Number(document.getElementById('inputMaterial').value);
        const price = Number(document.getElementById('inputPrice').value);

        if(!date) { alert('날짜를 선택해주세요.'); return; }
        if(!confirm(`${date}\n수량: ${delivery}개\n저장할까요?`)) return;

        try {
            await push(ref(db, 'delivery'), {
                date, delivery, material, price, total: delivery * price, timestamp: Date.now()
            });
            document.getElementById('inputDelivery').value = '';
            document.getElementById('inputMaterial').value = '';
            calculateTotal();
        } catch (e) { alert('저장 실패!'); }
    };

    window.deleteItem = async (id) => {
        if(confirm("이 기록을 삭제하시겠습니까?")) {
            try {
                await remove(ref(db, `delivery/${id}`));
            } catch (e) { alert("삭제 실패"); }
        }
    };

    // 데이터 읽기 경로를 'delivery'로 확실히 지정
    onValue(ref(db, 'delivery'), (snapshot) => {
        const data = snapshot.val();
        let totalQty = 0, totalPrice = 0, monthQty = 0, monthCount = 0;
        const historyHtml = [];
        const currentMonth = new Date().toISOString().substring(0, 7);

        if (data) {
            const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            // 날짜 내림차순 정렬
            items.sort((a, b) => b.date.localeCompare(a.date));

            items.forEach((item) => {
                totalQty += (item.delivery || 0);
                totalPrice += (item.total || 0);
                if(item.date && item.date.startsWith(currentMonth)) {
                    monthQty += (item.delivery || 0);
                    monthCount++;
                }
                historyHtml.push(`
                    <div class="history-item">
                        <span>${item.date} (${item.delivery}개) <b>₩${(item.total || 0).toLocaleString()}</b></span>
                        <button class="del-btn" onclick="deleteItem('${item.id}')">삭제</button>
                    </div>
                `);
            });
            document.getElementById('historyList').innerHTML = historyHtml.join('');
        } else {
            document.getElementById('historyList').innerHTML = '<p style="text-align:center; color:#999; font-size:12px;">기록이 없습니다.</p>';
        }

        document.getElementById('totalQty').innerText = totalQty + '개'; 
        document.getElementById('monthQty').innerText = monthQty + '개';
        document.getElementById('totalPrice').innerText = '₩' + totalPrice.toLocaleString();
        document.getElementById('monthCount').innerText = monthCount;
    });

    document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
</script>
</body>
</html>
