<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옷짓는 고양이</title>
    <style>
        :root {
            --ivory-bg: #F9F7F2;
            --gold-stitch: #D4AF37;
            --ink-black: #2C2C2C;
        }

        body {
            background-color: var(--ivory-bg);
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            color: var(--ink-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* 금색 스티치 테두리 */
        body::before {
            content: '';
            position: fixed;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px dashed var(--gold-stitch);
            stroke-dasharray: 25, 15;
            pointer-events: none;
            z-index: 1000;
        }

        .header { text-align: center; margin: 40px 0 10px; }
        
        /* 월 선택 및 전체 금액 보기 */
        .filter-section { margin-bottom: 20px; z-index: 1001; display: flex; gap: 10px; align-items: center; }
        select { padding: 8px; border-radius: 10px; border: 1px solid var(--gold-stitch); background: white; font-size: 14px; }

        .summary-card {
            background: linear-gradient(135deg, #fdfbf0 0%, #f5efd7 100%);
            width: 85%; max-width: 400px;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .total-amount { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .grand-total { font-size: 14px; color: #888; margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 10px; }

        .list-container { width: 90%; max-width: 400px; }
        .item-card {
            background: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--gold-stitch);
        }
        .item-info div { font-size: 12px; color: #888; }

        .footer-btns {
            position: fixed; bottom: 30px;
            display: flex; gap: 15px;
            width: 90%; max-width: 400px;
            z-index: 1001;
        }
        .btn {
            flex: 1; padding: 18px; border-radius: 35px; border: none;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .btn-black { background: #1a1c23; color: white; }
        .btn-gold { background: var(--gold-stitch); color: white; }

        /* 모달 스타일 */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px;
            border: 2px solid var(--gold-stitch);
        }
        label { font-size: 12px; color: var(--gold-stitch); font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">옷짓는 고양이</h2>
    </div>

    <div class="filter-section">
        <select id="viewMonth" onchange="render()">
            <option value="2026-04">2026년 4월</option>
            <option value="2026-05" selected>2026년 5월</option>
            <option value="2026-06">2026년 6월</option>
        </select>
        <span style="font-size: 12px; color: #888;">기록 보기</span>
    </div>

    <div class="summary-card">
        <div id="monthLabel" style="font-size: 14px;">2026년 05월</div>
        <div class="total-amount" id="monthlyTotal">0원</div>
        <div style="font-size:12px; opacity: 0.6;">월간 판매액</div>
        <div class="grand-total">누적 전체 금액: <span id="grandTotal">0원</span></div>
    </div>

    <div class="list-container" id="itemList"></div>

    <div class="footer-btns">
        <button class="btn btn-black" onclick="showModal()">🧵 수량 기록</button>
        <button class="btn btn-gold" onclick="alert('정산 기능 준비 중')">💰 정산 기록</button>
    </div>

    <!-- 입력 모달 -->
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <h3 style="margin: 0 0 20px 0; text-align: center;">기록 추가</h3>
            
            <label>판매 날짜</label>
            <input type="date" id="pDate">
            
            <label>품목명</label>
            <input type="text" id="pName" placeholder="예: 비단 저고리">
            
            <label>갯수</label>
            <input type="number" id="pCount" placeholder="0">
            
            <label>단가 (원)</label>
            <input type="number" id="pPrice" placeholder="0">
            
            <button class="btn btn-black" style="width:100%;" onclick="addRecord()">기록 저장</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#eee;" onclick="hideModal()">취소</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('needleCatDB_v2')) || [];

        // 오늘 날짜 기본값 설정
        document.getElementById('pDate').valueAsDate = new Date();

        function showModal() { document.getElementById('recordModal').style.display = 'flex'; }
        function hideModal() { document.getElementById('recordModal').style.display = 'none'; }

        function addRecord() {
            const date = document.getElementById('pDate').value;
            const name = document.getElementById('pName').value;
            const count = parseInt(document.getElementById('pCount').value);
            const price = parseInt(document.getElementById('pPrice').value);

            if(date && name && count && price) {
                // 입력된 날짜에서 'YYYY-MM' 추출
                const month = date.substring(0, 7);
                db.push({ date, month, name, count, price, id: Date.now() });
                saveAndRender();
                hideModal();
                // 입력폼 초기화
                document.getElementById('pName').value = '';
                document.getElementById('pCount').value = '';
                document.getElementById('pPrice').value = '';
            } else {
                alert("모든 항목을 입력해주세요.");
            }
        }

        function deleteRecord(id) {
            if(confirm("이 기록을 삭제할까요?")) {
                db = db.filter(item => item.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('needleCatDB_v2', JSON.stringify(db));
            render();
        }

        function render() {
            const targetMonth = document.getElementById('viewMonth').value;
            document.getElementById('monthLabel').innerText = targetMonth.replace('-', '년 ') + '월';
            
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            
            let mTotal = 0;
            let gTotal = 0;

            // 전체 금액 계산 (모든 데이터)
            db.forEach(item => gTotal += (item.price * item.count));

            // 해당 월 기록만 필터링 및 출력
            const filtered = db.filter(item => item.month === targetMonth)
                               .sort((a, b) => new Date(b.date) - new Date(a.date)); // 최신순 정렬
            
            filtered.forEach(item => {
                const sum = item.price * item.count;
                mTotal += sum;
                listEl.innerHTML += `
                    <div class="item-card">
                        <div style="flex:1;">
                            <div style="font-size:11px; color:var(--gold-stitch);">${item.date}</div>
                            <strong>${item.name}</strong>
                            <div style="font-size:12px; color:#888;">${item.price.toLocaleString()}원 × ${item.count}개</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold;">${sum.toLocaleString()}원</div>
                            <button onclick="deleteRecord(${item.id})" style="border:none; background:none; color:#ddd; cursor:pointer; font-size:11px;">삭제</button>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('monthlyTotal').innerText = mTotal.toLocaleString() + "원";
            document.getElementById('grandTotal').innerText = gTotal.toLocaleString() + "원";
        }

        render();
    </script>
</body>
</html>
