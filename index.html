<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>집 짓는 고양이</title>
    <style>
        :root { --main: #4CAF50; --bg: #F9F9F9; } /* 집 짓는 이미지에 맞춰 초록색 톤 */
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; font-size: 26px; font-weight: 900; color: #2E7D32; margin: 20px 0; }
        
        .summary-card { background: linear-gradient(135deg, #4CAF50, #2E7D32); border-radius: 24px; padding: 25px; color: white; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(76,175,80,0.2); }
        .label { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .value { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        
        .btn { background: #2E7D32; color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #EEE; }
        .del-btn { background: #FFEBEE; color: #F44336; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        #conn-status { font-size: 11px; text-align: center; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">🏠 집 짓는 고양이</div>
<div id="conn-status">서버 연결 시도 중...</div>

<div class="summary-card">
    <div class="label">이달의 작업 수량</div>
    <div id="monthQty" class="value">0개</div>
    <div class="label">누적 판매액</div>
    <div id="totalPrice" class="value">₩0</div>
</div>

<div class="card">
    <div class="input-group"><label>날짜</label><input type="date" id="inputDate"></div>
    <div class="input-group"><label>수량(개)</label><input type="number" id="inputDelivery" placeholder="0"></div>
    <div class="input-group"><label>단가(원)</label><input type="number" id="inputPrice" value="50000"></div>
    <button class="btn" onclick="saveData()">저장하기</button>
</div>

<div class="card">
    <h3 style="font-size:16px; margin:0 0 15px 0;">최근 기록</h3>
    <div id="historyList">기록을 불러오는 중...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdnFr8vjNOFeovvFm9Umxv kEpvnuAWLY",
        authDomain: "needle-cat.firebaseapp.com",
        databaseURL: "https://needle-cat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "needle-cat",
        appId: "1:422542027971:web:37f2298a24b2161209c676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const salesRef = ref(db, 'house_cat_records'); // 완전히 새로운 데이터 경로

    // 연결 확인
    onValue(ref(db, '.info/connected'), (snap) => {
        const status = document.getElementById('conn-status');
        if (snap.val() === true) {
            status.innerText = "● 서버와 연결되었습니다";
            status.style.color = "#2E7D32";
        } else {
            status.innerText = "○ 연결 시도 중...";
            status.style.color = "red";
        }
    });

    // 데이터 저장
    window.saveData = async () => {
        const date = document.getElementById('inputDate').value;
        const qty = Number(document.getElementById('inputDelivery').value || 0);
        const price = Number(document.getElementById('inputPrice').value || 0);

        if(!date || qty <= 0) return alert('날짜와 수량을 확인해주세요.');
        
        if(!confirm(`[저장 확인]\n날짜: ${date}\n수량: ${qty}개\n\n저장할까요?`)) return;

        try {
            await push(salesRef, {
                date, qty, price, total: qty * price, timestamp: Date.now()
            });
            document.getElementById('inputDelivery').value = '';
            alert('저장되었습니다.');
        } catch (e) { alert('오류 발생: ' + e.message); }
    };

    // 데이터 삭제
    window.deleteItem = (id) => {
        if(confirm('삭제하시겠습니까?')) remove(ref(db, `house_cat_records/${id}`));
    };

    // 화면 업데이트
    onValue(salesRef, (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('historyList');
        const currentMonth = new Date().toISOString().substring(0, 7);
        
        let mQty = 0, tPrice = 0;
        let html = '';

        if (data) {
            const sorted = Object.entries(data).sort((a, b) => b[1].date.localeCompare(a[1].date));
            sorted.forEach(([id, val]) => {
                tPrice += (val.total || 0);
                if(val.date.startsWith(currentMonth)) mQty += (val.qty || 0);
                
                html += `
                    <div class="history-item">
                        <div>
                            <div style="font-weight:bold;">${val.date}</div>
                            <div style="font-size:12px; color:#666;">${val.qty}개 / ₩${(val.total || 0).toLocaleString()}</div>
                        </div>
                        <button class="del-btn" onclick="deleteItem('${id}')">삭제</button>
                    </div>`;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<p style="text-align:center; color:#999; font-size:12px;">기록이 없습니다.</p>';
        }
        document.getElementById('monthQty').innerText = mQty + '개';
        document.getElementById('totalPrice').innerText = '₩' + tPrice.toLocaleString();
    });

    document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
</script>
</body>
</html>
