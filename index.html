<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>옷짓는 고양이</title>
    <style>
        :root {
            --bg-color: #F8FAFC;
            --card-bright: #38BDF8;
            --accent-blue: #0284C7;
            --text-dark: #0F172A;
            --text-gray: #64748B;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 25px; font-size: 24px; font-weight: 800; color: var(--text-dark); }

        /* 대시보드 */
        .main-card {
            background: linear-gradient(135deg, var(--card-bright), var(--accent-blue));
            border-radius: 30px; padding: 30px; color: white;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
        }
        .card-label { font-size: 14px; opacity: 0.9; margin-bottom: 5px; }
        .main-value { font-size: 40px; font-weight: 800; margin-bottom: 20px; }
        .total-sales-value { font-size: 26px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 20px; }
        .card-footer { display: flex; gap: 20px; font-size: 14px; }
        .circle-deco { position: absolute; right: -20px; bottom: -20px; width: 140px; height: 140px; border: 15px solid rgba(255, 255, 255, 0.15); border-radius: 50%; }

        /* 입력 폼 */
        .input-group {
            background: white; border-radius: 24px; padding: 22px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        input {
            width: 100%; padding: 13px; margin-bottom: 12px;
            border: 1px solid #E2E8F0; border-radius: 12px;
            box-sizing: border-box; font-size: 15px; background-color: #F8FAFC;
        }
        .btn-save {
            background: var(--accent-blue); color: white; border: none;
            padding: 16px; border-radius: 12px; width: 100%;
            font-size: 16px; font-weight: 700; cursor: pointer;
        }

        /* 기록 리스트: 넓은 간격의 텍스트 형식 */
        .history-container { background: white; border-radius: 24px; padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .history-item {
            padding: 18px 0;
            border-bottom: 1px solid #F1F5F9;
            font-size: 16px;
            display: flex;
            justify-content: space-between; /* 양 끝 정렬 */
        }
        .history-item:last-child { border-bottom: none; }
        .h-date { width: 110px; color: var(--text-dark); }
        .h-qty { flex: 1; text-align: center; color: var(--text-gray); }
        .h-price { width: 120px; text-align: right; font-weight: 700; color: var(--text-dark); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">옷짓는 고양이</div>

        <div class="main-card">
            <div class="circle-deco"></div>
            <div class="card-label">26년 5월 납품 수량</div>
            <div class="main-value"><span id="monthDelivery">0</span>개</div>
            
            <div class="card-label">총 판매액 (3/10 제외)</div>
            <div class="total-sales-value">₩<span id="totalPrice">0</span></div>
            
            <div class="card-footer">
                <div>월 건수: <span id="monthCount">0</span>건</div>
                <div>누적 납품: <span id="totalDelivery">0</span>개</div>
            </div>
        </div>

        <div class="input-group">
            <input type="date" id="inDate">
            <input type="number" id="inDeliv" placeholder="납품 수량">
            <input type="number" id="inUnitPrice" placeholder="단가" value="50000">
            <input type="text" id="inTotalPrice" readonly placeholder="총 금액 자동계산">
            <button class="btn-save" onclick="confirmAndSave()">저장하기</button>
        </div>

        <div class="history-container" id="historyList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdnFr8vjNOfOeovvFm9UmxvkEpvnuAWLY",
            authDomain: "needle-cat.firebaseapp.com",
            projectId: "needle-cat",
            storageBucket: "needle-cat.appspot.com",
            messagingSenderId: "422542027971",
            appId: "1:422542027971:web:37f2298a24b2161209c676"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 자동 계산
        const inDeliv = document.getElementById('inDeliv');
        const inUnitPrice = document.getElementById('inUnitPrice');
        const inTotalPrice = document.getElementById('inTotalPrice');
        function updateCalc() { inTotalPrice.value = (Number(inDeliv.value) || 0) * (Number(inUnitPrice.value) || 0); }
        inDeliv.oninput = updateCalc; inUnitPrice.oninput = updateCalc;

        document.getElementById('inDate').valueAsDate = new Date();

        // 저장 함수
        window.confirmAndSave = async () => {
            if (!confirm("데이터를 저장하시겠습니까?")) return;
            const data = {
                date: document.getElementById('inDate').value,
                delivery: Number(inDeliv.value),
                unitPrice: Number(inUnitPrice.value),
                price: Number(inDeliv.value * inUnitPrice.value),
                timestamp: new Date()
            };
            await addDoc(collection(db, "sales"), data);
            alert("저장되었습니다.");
            inDeliv.value = ""; updateCalc();
        };

        // 데이터 불러오기 및 실시간 업데이트
        onSnapshot(query(collection(db, "sales"), orderBy("date", "desc")), (snap) => {
            let tD = 0, tP = 0, mD = 0, mC = 0;
            const currM = new Date().toISOString().slice(0, 7);
            const list = document.getElementById('historyList');
            list.innerHTML = "";

            snap.forEach(doc => {
                const d = doc.data();
                
                // [복구 로직] 모든 데이터를 리스트엔 보여주되, 3월 10일만 합계에서 제외
                let isMarch10 = (d.date === "2026-03-10");

                if (!isMarch10) {
                    tD += d.delivery; 
                    tP += d.price;
                    if(d.date.startsWith(currM)) { mD += d.delivery; mC++; }
                }

                // 리스트 출력 (간격 넓게)
                const dotDate = d.date.replace(/-/g, '.');
                list.insertAdjacentHTML('beforeend', `
                    <div class="history-item" style="${isMarch10 ? 'opacity:0.5; background:#fff0f0;' : ''}">
                        <span class="h-date">${dotDate}</span>
                        <span class="h-qty">${d.delivery}개</span>
                        <span class="h-price">${d.price.toLocaleString()}원</span>
                    </div>
                `);
            });

            document.getElementById('totalDelivery').innerText = tD.toLocaleString();
            document.getElementById('totalPrice').innerText = tP.toLocaleString();
            document.getElementById('monthDelivery').innerText = mD.toLocaleString();
            document.getElementById('monthCount').innerText = mC.toLocaleString();
        });
    </script>
</body>
</html>
