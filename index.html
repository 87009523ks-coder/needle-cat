<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웃 짓는 고양이</title>
    <style>
        :root { --main: #2196F3; --bg: #F5F7FA; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; font-size: 24px; font-weight: 800; color: #1A237E; margin: 20px 0; }
        .summary-card { background: linear-gradient(135deg, #2196F3, #1976D2); border-radius: 24px; padding: 25px; color: white; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(33,150,243,0.2); }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 10px; box-sizing: border-box; font-size: 15px; }
        .btn { background: var(--main); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #EEE; }
        .del-btn { background: #FFEBEE; color: #F44336; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">웃 짓는 고양이</div>

<div class="summary-card">
    <div style="font-size:13px; opacity:0.9;">이달의 납품 수량</div>
    <div id="monthQty" style="font-size:28px; font-weight:700; margin-bottom:15px;">0개</div>
    <div style="font-size:13px; opacity:0.9;">총 판매액</div>
    <div id="totalPrice" style="font-size:28px; font-weight:700;">₩0</div>
</div>

<div class="card">
    <div class="input-group"><label>날짜</label><input type="date" id="inputDate"></div>
    <div class="input-group"><label>수량(개)</label><input type="number" id="inputDelivery" placeholder="0"></div>
    <div class="input-group"><label>단가(원)</label><input type="number" id="inputPrice" value="50000"></div>
    <button class="btn" onclick="saveData()">저장하기</button>
</div>

<div class="card">
    <h3 style="font-size:16px; margin-top:0;">최근 기록</h3>
    <div id="historyList">데이터를 확인 중입니다...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBdnFr8vjNOFeovvFm9Umxv kEpvnuAWLY",
        authDomain: "needle-cat.firebaseapp.com",
        // ★ 중요: 싱가포르 서버 주소를 직접 입력했습니다.
        databaseURL: "https://needle-cat-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "needle-cat",
        storageBucket: "needle-cat.appspot.com",
        appId: "1:422542027971:web:37f2298a24b2161209c676"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 저장 함수
    window.saveData = async () => {
        const date = document.getElementById('inputDate').value;
        const delivery = Number(document.getElementById('inputDelivery').value || 0);
        const price = Number(document.getElementById('inputPrice').value || 0);

        if(!date) return alert('날짜를 선택하세요');

        try {
            await push(ref(db, 'records'), {
                date, delivery, price, total: delivery * price
            });
            alert('저장 완료!');
            document.getElementById('inputDelivery').value = '';
        } catch (e) { alert('오류: ' + e.message); }
    };

    // 삭제 함수
    window.deleteItem = (id) => {
        if(confirm('삭제할까요?')) remove(ref(db, `records/${id}`));
    };

    // 실시간 데이터 읽기
    onValue(ref(db, 'records'), (snapshot) => {
        const data = snapshot.val();
        const list = document.getElementById('historyList');
        let mQty = 0, tPrice = 0;
        let html = '';

        if(data) {
            const items = Object.entries(data).reverse(); // 최신순
            items.forEach(([id, val]) => {
                mQty += (val.delivery || 0);
                tPrice += (val.total || 0);
                html += `
                    <div class="history-item">
                        <div><b>${val.date}</b><br><small>${val.delivery}개 / ₩${(val.total || 0).toLocaleString()}</small></div>
                        <button class="del-btn" onclick="deleteItem('${id}')">삭제</button>
                    </div>`;
            });
            list.innerHTML = html;
        } else {
            list.innerHTML = '<p style="text-align:center; color:#999;">기록이 없습니다.</p>';
        }
        document.getElementById('monthQty').innerText = mQty + '개';
        document.getElementById('totalPrice').innerText = '₩' + tPrice.toLocaleString();
    });

    document.getElementById('inputDate').value = new Date().toISOString().substring(0,10);
</script>
</body>
</html>
